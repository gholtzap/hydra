name = "hydra-auth"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "DISCORD_RELAY", class_name = "DiscordRelayHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordRelayHub"]

[alias]
"@opentelemetry/api" = "./src/otel-noop.ts"

[[d1_databases]]
binding = "DATABASE"
database_name = "hydra-auth"
database_id = "e1b0dcac-dfb1-4121-a95a-319131039f54"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
